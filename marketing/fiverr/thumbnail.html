<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Book Orders Thumbnail</title>
    <meta name="viewport" content="width=1024" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --primary: #6f4626; /* site primary (ancient brown) */
        --accent: #845d16; /* site accent (gold) */
        --accent-light: #d9b46a;
        --ink: #2b1d12;
        --soft: #5e4b39;
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      html,
      body {
        width: 1024px;
        height: 768px;
        background: #fff;
        overflow: hidden;
      }
      body {
        font-family: 'Poppins', system-ui, sans-serif;
        color: var(--ink);
        position: relative;
      }

      /* Soft colour blobs */
      .blob {
        position: absolute;
        border-radius: 50%;
        filter: blur(2px);
      }
      .blob-tl {
        width: 420px;
        height: 360px;
        left: -170px;
        top: -170px;
        background: radial-gradient(
          circle at 60% 60%,
          rgba(217, 180, 106, 0.38),
          rgba(217, 180, 106, 0.08) 70%
        );
        border-radius: 46% 54% 58% 42% / 52% 44% 56% 48%;
      }
      .blob-br {
        width: 460px;
        height: 400px;
        right: -190px;
        bottom: -200px;
        background: radial-gradient(circle at 40% 40%, rgba(111, 70, 38, 0.22), rgba(111, 70, 38, 0.05) 70%);
        border-radius: 55% 45% 40% 60% / 45% 55% 45% 55%;
      }

      .stage {
        position: absolute;
        inset: 48px;
        display: flex;
      }
      .left {
        width: 55%;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding-right: 24px;
        position: relative;
      }
      .right {
        width: 45%;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .brand {
        position: absolute;
        top: 0;
        left: 0;
        display: flex;
        align-items: center;
        gap: 10px;
        font-weight: 600;
        font-size: 15px;
        color: var(--primary);
        letter-spacing: 0.01em;
      }
      .brand svg {
        width: 34px;
        height: 34px;
      }

      .h1 {
        font-size: 30px;
        font-weight: 600;
        color: var(--soft);
        line-height: 1.2;
      }
      .h2 {
        font-size: 72px;
        font-weight: 800;
        color: var(--primary);
        line-height: 1.02;
        margin-top: 6px;
        letter-spacing: -0.01em;
      }
      .sub {
        font-size: 20px;
        font-weight: 300;
        color: var(--soft);
        line-height: 1.45;
        margin-top: 22px;
        max-width: 470px;
      }
      .badge {
        align-self: flex-start;
        margin-top: 28px;
        border: 2px solid var(--accent);
        color: var(--accent);
        border-radius: 999px;
        padding: 9px 22px;
        font-size: 16px;
        font-weight: 600;
        display: inline-flex;
        align-items: center;
        gap: 10px;
      }
      .badge::before {
        content: '';
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: var(--accent);
      }

      /* Phone mockup */
      .phone {
        position: relative;
        width: 292px;
        height: 632px;
        border-radius: 46px;
        background: #17110c;
        padding: 12px;
        box-shadow:
          0 30px 60px -18px rgba(43, 29, 18, 0.45),
          0 12px 24px -12px rgba(43, 29, 18, 0.35),
          inset 0 0 0 2px #3a2c21;
      }
      .phone::before {
        content: '';
        position: absolute;
        top: 22px;
        left: 50%;
        width: 86px;
        height: 24px;
        transform: translateX(-50%);
        background: #17110c;
        border-radius: 14px;
        z-index: 2;
      }
      .screen {
        width: 100%;
        height: 100%;
        border-radius: 35px;
        overflow: hidden;
        background: #fbf7ef;
        display: flex;
        flex-direction: column;
      }
      /* Status-bar strip, so the camera cut-out sits above the page, not on it */
      .status {
        flex: 0 0 34px;
        background: #fbf7ef;
      }
      .screen img {
        flex: 1;
        width: 100%;
        min-height: 0;
        object-fit: cover;
        object-position: top;
        display: block;
      }

      .dots {
        position: absolute;
        top: 52px;
        right: 4px;
        width: 84px;
        height: 56px;
        background-image: radial-gradient(var(--accent-light) 2.2px, transparent 2.6px);
        background-size: 14px 14px;
        opacity: 0.8;
      }
      .wave {
        position: absolute;
      }
      .wave-tr {
        top: 0;
        right: 0;
      }
      .wave-bl {
        bottom: 0;
        left: 0;
      }
    </style>
  </head>
